# All test films. Edit this file by hand; pick_films.py copies the films you
# select into selection.yaml, and only those run in dvc.yaml.
#
# Film ids name one video exactly (title + year, or series + episode), so
# ann-droid-s01e01 and ann-droid-s01e02 never collide. Subtitles live in
# films/<film id>/; videos are too large for the repository and stay where
# they are (absolute paths are fine). Paths are relative to this lab/
# directory.
dog-man-2025:
  video: "F:/Dog Man (2025) [1080p] [WEBRip] [5.1] [YTS.MX]/Dog.Man.2025.1080p.WEBRip.x264.AAC5.1-[YTS.MX].mp4"
  # subtitle to retime, as downloaded
  original: films/dog-man-2025/original.srt
  # reference timeline for evaluate_timing.py (disputes are counted against it)
  baseline: films/dog-man-2025/ffsubsync.srt
# Cues 1092-1151 of Dog Man to study in a debugger, cut by make_sample.py
# with context: the files hold cues 1076-1161.
# `whisper` points at a transcript cut from the film's: films with one skip
# the transcribe stage.
dog-man-2025-sample-1092-1151:
  video: "F:/Dog Man (2025) [1080p] [WEBRip] [5.1] [YTS.MX]/Dog.Man.2025.1080p.WEBRip.x264.AAC5.1-[YTS.MX].mp4"
  original: films/dog-man-2025-sample-1092-1151/original.srt
  baseline: films/dog-man-2025-sample-1092-1151/ffsubsync.srt
  whisper: films/dog-man-2025-sample-1092-1151/whisper
ann-droid-s01e01:
  video: "F:/Videos/Ann Droid/Ann Droid S01E01 1080p iP WEB-DL AAC2 0 H 264-RAWR[EZTVx.to].mkv"
  original: films/ann-droid-s01e01/original.srt
  # ffsubsync.srt runs a median 5.3 s earlier than the speech (the audio
  # preferred both approaches' output on 340+ of 476 lines), so the
  # original, which both outputs stay within ~0.1 s of, is the reference.
  baseline: films/ann-droid-s01e01/original.srt
