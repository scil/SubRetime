<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>七步 × 状态 · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif SC', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .note {
      margin-top: 1rem;
      font-size: 0.8rem;
      line-height: 1.6;
      color: var(--color-muted);
    }
    .note code { font-family: var(--font-mono); font-size: 0.75rem; }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · align_srt.py</p>
    <h1>七步 × 状态：哪一步处理、哪一步绕过</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cue-steps-swimlane-title cue-steps-swimlane-desc">
        <title id="cue-steps-swimlane-title">七步 × 状态：哪一步处理、哪一步绕过</title>
        <desc id="cue-steps-swimlane-desc">泳道图：align_subtitles 的七个步骤按顺序横向排列，六条泳道各是一种 cue 状态，标出每一步处理哪些状态、哪些状态原样绕过，以及各步造成的状态转换。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== Focal lane band (outlier) ===== -->
        <rect x="40" y="176" width="1200" height="96" fill="rgba(235,108,54,0.06)"/>

        <!-- ===== Step headers (columns, centres 252 … 1140, pitch 148) ===== -->
        <g font-family="'Geist Mono', monospace" text-anchor="middle">
          <text x="252" y="48" fill="#7a8399" font-size="8" letter-spacing="0.18em">01</text>
          <text x="252" y="64" fill="#2d3142" font-size="10" font-weight="500">time_cues</text>
          <text x="400" y="48" fill="#7a8399" font-size="8" letter-spacing="0.18em">02</text>
          <text x="400" y="64" fill="#2d3142" font-size="10" font-weight="500">reject_outliers</text>
          <text x="548" y="48" fill="#7a8399" font-size="8" letter-spacing="0.18em">03</text>
          <text x="548" y="64" fill="#2d3142" font-size="10" font-weight="500">interpolate_missing</text>
          <text x="696" y="48" fill="#7a8399" font-size="8" letter-spacing="0.18em">04 · OPTIONAL</text>
          <text x="696" y="64" fill="#2d3142" font-size="10" font-weight="500">verify_with_audio</text>
          <text x="844" y="48" fill="#7a8399" font-size="8" letter-spacing="0.18em">05</text>
          <text x="844" y="64" fill="#2d3142" font-size="10" font-weight="500">rescue_local</text>
          <text x="992" y="48" fill="#7a8399" font-size="8" letter-spacing="0.18em">06</text>
          <text x="992" y="64" fill="#2d3142" font-size="10" font-weight="500">revert_out_of_order</text>
          <text x="1140" y="48" fill="#7a8399" font-size="8" letter-spacing="0.18em">07</text>
          <text x="1140" y="64" fill="#2d3142" font-size="10" font-weight="500">finalize_timing</text>
        </g>

        <!-- ===== Lane dividers (lane height 96; centres 128 224 320 416 512 608) ===== -->
        <line x1="40" y1="80" x2="1240" y2="80" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="40" y1="176" x2="1240" y2="176" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="272" x2="1240" y2="272" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="368" x2="1240" y2="368" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="464" x2="1240" y2="464" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="560" x2="1240" y2="560" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="656" x2="1240" y2="656" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="184" y1="80" x2="184" y2="656" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

        <!-- ===== Lane labels ===== -->
        <g font-family="'Geist Mono', monospace" font-size="11" font-weight="500">
          <text x="52" y="125" fill="#2d3142">anchored</text>
          <text x="52" y="221" fill="#eb6c36">outlier</text>
          <text x="52" y="317" fill="#2d3142">verified</text>
          <text x="52" y="413" fill="#2d3142">rescued</text>
          <text x="52" y="509" fill="#2d3142">interpolated</text>
          <text x="52" y="605" fill="#2d3142">none</text>
        </g>
        <g font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#4f5d75">
          <text x="52" y="143">匹配词定时</text>
          <text x="52" y="239">离群，改用插值</text>
          <text x="52" y="335">音频复核后恢复</text>
          <text x="52" y="431">局部搜救找回</text>
          <text x="52" y="527">插值定位</text>
          <text x="52" y="623">未匹配</text>
        </g>

        <!-- ===== Pass-through lines (cue carried along its lane) ===== -->
        <g stroke="#7a8399" stroke-width="1" fill="none">
          <!-- anchored: 01 → 02, 02 → 06 (bypass 03 04 05), 06 → 07 -->
          <line x1="312" y1="128" x2="340" y2="128"/>
          <line x1="460" y1="128" x2="932" y2="128"/>
          <line x1="1052" y1="128" x2="1080" y2="128"/>
          <!-- outlier: enters at 02, acted on by 03 04 05 06 -->
          <line x1="444" y1="224" x2="488" y2="224"/>
          <line x1="608" y1="224" x2="636" y2="224"/>
          <line x1="756" y1="224" x2="784" y2="224"/>
          <line x1="904" y1="224" x2="932" y2="224"/>
          <line x1="1052" y1="224" x2="1080" y2="224"/>
          <!-- verified: enters at 04, bypass 05 (hops over the 05 arrow), 06, hops over the 06 rescued arrow -->
          <path d="M 736,320 H 816 a 8,8 0 0,1 16,0 H 932"/>
          <path d="M 1020,320 H 1032 a 8,8 0 0,1 16,0 H 1080"/>
          <!-- rescued: enters at 05, acted on by 06 -->
          <line x1="884" y1="416" x2="932" y2="416"/>
          <line x1="1052" y1="416" x2="1080" y2="416"/>
          <!-- interpolated: enters at 03, bypass 04, acted on by 05, bypass 06 -->
          <line x1="604" y1="512" x2="784" y2="512"/>
          <line x1="904" y1="512" x2="1080" y2="512"/>
          <!-- none: 01 → 03 (bypass 02), empty after 03 -->
          <line x1="312" y1="608" x2="488" y2="608"/>
        </g>

        <!-- Bypass marks: hollow ring where a step skips the lane -->
        <g fill="#f5f5f5" stroke="#7a8399" stroke-width="1">
          <circle cx="548" cy="128" r="4"/>
          <circle cx="696" cy="128" r="4"/>
          <circle cx="844" cy="128" r="4"/>
          <circle cx="844" cy="320" r="4"/>
          <circle cx="696" cy="512" r="4"/>
          <circle cx="992" cy="512" r="4"/>
          <circle cx="400" cy="608" r="4"/>
        </g>

        <!-- ===== Status-change arrows (drawn before nodes) ===== -->
        <g stroke="#4f5d75" stroke-width="1.2" fill="none">
          <!-- 02 anchored → outlier -->
          <line x1="400" y1="152" x2="400" y2="211" marker-end="url(#arrow)"/>
          <!-- 03 none → interpolated -->
          <line x1="548" y1="584" x2="548" y2="525" marker-end="url(#arrow)"/>
          <!-- 04 outlier → verified (optional, --audio) -->
          <line x1="696" y1="248" x2="696" y2="307" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <!-- 05 outlier → rescued (crosses the verified lane; the verified line hops) -->
          <line x1="824" y1="248" x2="824" y2="403" marker-end="url(#arrow)"/>
          <!-- 05 interpolated → rescued -->
          <line x1="844" y1="488" x2="844" y2="429" marker-end="url(#arrow)"/>
          <!-- 06 anchored → outlier -->
          <line x1="992" y1="152" x2="992" y2="199" marker-end="url(#arrow)"/>
          <!-- 06 verified → outlier -->
          <line x1="976" y1="296" x2="976" y2="249" marker-end="url(#arrow)"/>
          <!-- 06 rescued → outlier (passes 12px right of the verified node; the verified line hops) -->
          <line x1="1040" y1="392" x2="1040" y2="249" marker-end="url(#arrow)"/>
        </g>

        <!-- Arrow labels (beside vertical segments, 8px gap) -->
        <g font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em" fill="#7a8399">
          <rect x="792" y="280" width="24" height="12" rx="2" fill="#f5f5f5"/>
          <text x="804" y="289">+16</text>
          <rect x="852" y="440" width="20" height="12" rx="2" fill="#f5f5f5"/>
          <text x="862" y="449">+5</text>
          <rect x="1000" y="158" width="60" height="12" rx="2" fill="#f5f5f5"/>
          <text x="1030" y="167">0 THIS RUN</text>
          <rect x="908" y="278" width="60" height="12" rx="2" fill="#f5f5f5"/>
          <text x="938" y="287">3 REVERTED</text>
          <rect x="972" y="374" width="60" height="12" rx="2" fill="#f5f5f5"/>
          <text x="1002" y="383">0 THIS RUN</text>
        </g>

        <!-- ===== Spanning blocks: 01 and 07 act on every cue ===== -->
        <rect x="192" y="88" width="120" height="560" rx="6" fill="#f5f5f5"/>
        <rect x="192" y="88" width="120" height="560" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="252" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">逐条定时</text>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">
          <text x="252" y="131">anchored 1213</text>
          <text x="252" y="611">none 178</text>
        </g>

        <rect x="1080" y="88" width="120" height="560" rx="6" fill="#f5f5f5"/>
        <rect x="1080" y="88" width="120" height="560" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="1140" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">收尾定时</text>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">
          <text x="1140" y="131">anchored 1105</text>
          <text x="1140" y="227">outlier 86</text>
          <text x="1140" y="323">verified 6</text>
          <text x="1140" y="419">rescued 21</text>
          <text x="1140" y="515">interpolated 173</text>
          <text x="1140" y="611">none 0</text>
          <text x="1140" y="636" fill="#7a8399">status unchanged</text>
        </g>

        <!-- ===== Entry chips: a status appears in its lane ===== -->
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">
          <rect x="356" y="212" width="88" height="24" rx="4" fill="#f5f5f5" stroke="#7a8399" stroke-width="0.8"/>
          <text x="400" y="227">outlier +108</text>
          <rect x="492" y="500" width="112" height="24" rx="4" fill="#f5f5f5" stroke="#7a8399" stroke-width="0.8"/>
          <text x="548" y="515">interpolated +178</text>
          <rect x="656" y="308" width="80" height="24" rx="4" fill="#f5f5f5" stroke="#7a8399" stroke-width="0.8"/>
          <text x="696" y="323">verified +9</text>
          <rect x="804" y="404" width="80" height="24" rx="4" fill="#f5f5f5" stroke="#7a8399" stroke-width="0.8"/>
          <text x="844" y="419">rescued +21</text>
        </g>

        <!-- ===== Step nodes: a step acts on this lane ===== -->
        <g font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">
          <!-- anchored · 02 -->
          <rect x="340" y="104" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="400" y="125">剔除离群</text>
          <!-- anchored · 06 -->
          <rect x="932" y="104" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="992" y="125">乱序回退</text>
          <!-- outlier · 03 -->
          <rect x="488" y="200" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="548" y="221">插值补时</text>
          <!-- outlier · 04 (optional) -->
          <rect x="636" y="200" width="120" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="636" y="200" width="120" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
          <text x="696" y="221">音频复核</text>
          <!-- outlier · 05 -->
          <rect x="784" y="200" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="844" y="221">局部搜救</text>
          <!-- outlier · 06 -->
          <rect x="932" y="200" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="992" y="221">重新插值</text>
          <!-- verified · 06 (narrow, leaves a lane for the rescued arrow) -->
          <rect x="932" y="296" width="88" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="976" y="317">乱序回退</text>
          <!-- rescued · 06 -->
          <rect x="932" y="392" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="992" y="413">乱序回退</text>
          <!-- interpolated · 05 -->
          <rect x="784" y="488" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="844" y="509">局部搜救</text>
          <!-- none · 03 -->
          <rect x="488" y="584" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="548" y="605">插值补时</text>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">
          <text x="400" y="141">|Δ−median| &gt; 1.5 s</text>
          <text x="992" y="141">out of order &gt; 1 s</text>
          <text x="548" y="237">keeps label</text>
          <text x="696" y="237">--audio · ≥3 words</text>
          <text x="844" y="237">fuzzy ±1.5 s ≥85</text>
          <text x="992" y="237">reverted cues</text>
          <text x="976" y="333">out of order</text>
          <text x="992" y="429">out of order &gt; 1 s</text>
          <text x="844" y="525">fuzzy ±1.5 s ≥85</text>
          <text x="548" y="621">orig + median Δ</text>
        </g>

        <!-- none lane ends after 03 -->
        <text x="624" y="612" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">此后为 0 条</text>

        <!-- ===== Legend ===== -->
        <line x1="40" y1="676" x2="1240" y2="676" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <g font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#4f5d75">
          <rect x="40" y="712" width="20" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="68" y="722">步骤处理该状态</text>

          <rect x="208" y="712" width="20" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
          <text x="236" y="722">可选步骤（--audio）</text>

          <rect x="400" y="712" width="20" height="12" rx="3" fill="#f5f5f5" stroke="#7a8399" stroke-width="0.8"/>
          <text x="428" y="722">状态进入 +条数</text>

          <line x1="568" y1="718" x2="596" y2="718" stroke="#7a8399" stroke-width="1"/>
          <circle cx="582" cy="718" r="4" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
          <text x="604" y="722">绕过：原样通过</text>

          <line x1="744" y1="718" x2="772" y2="718" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
          <text x="780" y="722">状态改变</text>

          <rect x="880" y="708" width="12" height="20" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="900" y="722">作用于全部 cue</text>

          <rect x="1048" y="712" width="20" height="12" rx="2" fill="rgba(235,108,54,0.06)"/>
          <text x="1076" y="722">焦点：outlier 泳道</text>
        </g>
      </svg>
    </div>

    <p class="note">数字取自 dog-man-2025（1391 条 cue，带 <code>--audio</code> 运行）。07 <code>finalize_timing</code> 只调时间、不改状态：不重叠（间隔 0.084 s）、阅读速度 17 字/秒、时长 0.8–7 s、最多提前 0.5 s 开始。06 把越界的 PLACED cue（anchored、verified、rescued）改回 <code>outlier</code> 后立即重新插值。</p>
  </div>
</body>
</html>
