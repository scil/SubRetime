# Development pipeline. Run DVC commands from this lab/ directory (the DVC
# project itself, .dvc/, is at the repository root). `dvc repro` reruns only
# the stages whose inputs, code or params changed, for the films in
# selection.yaml (pick them with pick_films.py). Outputs go to work/<film>/
# and out/<film>/ (git-ignored, cached by DVC per experiment), except the
# metrics JSON files, which are committed.
#
# cache/<film>/confidence.sqlite remembers the audio judge's scores across
# runs (align_srt.py --audio-cache). It is deliberately not a DVC output:
# DVC deletes a stage's outputs before running it, which would empty the
# cache every time. Delete the folder to start fresh.
vars:
  - selection.yaml

stages:
  transcribe:
    # Only films without a transcript of their own (see pick_films.py).
    foreach: ${transcribe}
    do:
      cmd: >-
        whisperx "${item.video}" --language ${whisper.language}
        --model ${whisper.model} --device ${whisper.device}
        --compute_type ${whisper.compute_type}
        --output_format json --output_dir work/${key}/whisper
      deps:
        - ${item.video}
      params:
        - whisper
      outs:
        - work/${key}/whisper

  align:
    foreach: ${films}
    do:
      cmd: >-
        python ../align_srt.py "${item.original}" ${item.whisper}
        out/${key}/fixed.srt --audio "${item.video}" --quiet
        --report out/${key}/fixed.report.csv --snapshots out/${key}/steps
        --metrics out/${key}/align.json --params params.yaml
        --changes out/${key}/changes.csv
        --audio-cache cache/${key}/confidence.sqlite
      deps:
        - ../align_srt.py
        - ${item.original}
        - ${item.video}
        - ${item.whisper}
      params:
        - align
      outs:
        - out/${key}/fixed.srt
        - out/${key}/fixed.report.csv
        - out/${key}/changes.csv
      metrics:
        - out/${key}/align.json:
            cache: false
      plots:
        # One chart per step snapshot: shift of every cue against the original.
        - out/${key}/steps:
            x: index
            y: shift_s

  diagrams:
    # Flowchart and Sankey of how the cues moved between statuses, step by
    # step, computed from the snapshots (see flow_diagrams.py).
    foreach: ${films}
    do:
      cmd: python flow_diagrams.py out/${key}
      deps:
        - flow_diagrams.py
        - out/${key}/steps
      outs:
        - out/${key}/diagrams

  evaluate:
    foreach: ${films}
    do:
      cmd: >-
        python ../evaluate_timing.py "${item.baseline}" out/${key}/fixed.srt
        --audio "${item.video}" --json out/${key}/eval.json
        --audio-cache cache/${key}/confidence.sqlite
      deps:
        - ../evaluate_timing.py
        - ../align_srt.py
        - ${item.baseline}
        - out/${key}/fixed.srt
      metrics:
        - out/${key}/eval.json:
            cache: false
