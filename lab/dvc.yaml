# Development pipeline. Run DVC commands from this lab/ directory (the DVC
# project itself, .dvc/, is at the repository root). `dvc repro` reruns only
# the stages whose inputs, code or params changed, for the films in
# selection.yaml (pick them with pick_films.py). Outputs go to work/<film>/
# and out/<film>/<approach>/ (git-ignored, cached by DVC per experiment),
# except the metrics JSON files, which are committed.
#
# Two approaches run side by side, and both outputs are kept. Both are
# align_srt.py; they differ only in where the timed words come from:
# - Approach 0 (stages transcribe_0 / align_0 / diagrams_0 / evaluate_0): the
#   WhisperX transcript; out/<film>/0/.
# - Approach A (stages align_A / diagrams_A / evaluate_A): no transcript;
#   the original subtitle's own text, force-aligned near its own times
#   (align_srt.py --force-align); out/<film>/A/.
# The two have the same files, so <approach> is the only difference in a
# path, and _0 / _A the only difference in a stage name.
#
# cache/<film>/confidence.sqlite remembers the audio judge's scores and
# Approach A's forced alignments across runs (align_srt.py --audio-cache).
# It is deliberately not a DVC output: DVC deletes a stage's outputs before
# running it, which would empty the cache every time. Delete the folder to
# start fresh.
vars:
  - selection.yaml

stages:
  transcribe_0:
    # Only films without a transcript of their own (see pick_films.py).
    foreach: ${transcribe}
    do:
      cmd: >-
        whisperx "${item.video}" --language ${whisper.language}
        --model ${whisper.model} --device ${whisper.device}
        --compute_type ${whisper.compute_type}
        --output_format json --output_dir work/${key}/whisper
      deps:
        - ${item.video}
      params:
        - whisper
      outs:
        - work/${key}/whisper

  align_0:
    foreach: ${films}
    do:
      cmd: >-
        python ../align_srt.py "${item.original}" ${item.whisper}
        out/${key}/0/fixed.srt --audio "${item.video}" --quiet
        --report out/${key}/0/fixed.report.csv --snapshots out/${key}/0/steps
        --metrics out/${key}/0/align.json --params params.yaml
        --changes out/${key}/0/changes.csv
        --audio-cache cache/${key}/confidence.sqlite
      deps:
        - ../align_srt.py
        - ${item.original}
        - ${item.video}
        - ${item.whisper}
      params:
        - align
      outs:
        - out/${key}/0/fixed.srt
        - out/${key}/0/fixed.report.csv
        - out/${key}/0/changes.csv
      metrics:
        - out/${key}/0/align.json:
            cache: false
      plots:
        # One chart per step snapshot: shift of every cue against the original.
        - out/${key}/0/steps:
            x: index
            y: shift_s

  diagrams_0:
    # Flowchart and Sankey of how the cues moved between statuses, step by
    # step, computed from the snapshots (see flow_diagrams.py).
    foreach: ${films}
    do:
      cmd: python flow_diagrams.py out/${key}/0
      deps:
        - flow_diagrams.py
        - out/${key}/0/steps
      outs:
        - out/${key}/0/diagrams

  evaluate_0:
    foreach: ${films}
    do:
      cmd: >-
        python ../evaluate_timing.py "${item.baseline}" out/${key}/0/fixed.srt
        --audio "${item.video}" --json out/${key}/0/eval.json
        --audio-cache cache/${key}/confidence.sqlite
      deps:
        - ../evaluate_timing.py
        - ../align_srt.py
        - ${item.baseline}
        - out/${key}/0/fixed.srt
      metrics:
        - out/${key}/0/eval.json:
            cache: false

  align_A:
    # Approach A: the same command as align_0, but the words come from
    # force-aligning the original's own text near its own times instead of
    # from a transcript. To take the text and times from ffsubsync's
    # subtitle instead, replace the second "${item.original}" with
    # "${item.baseline}" (but that is also evaluate_A's reference timeline).
    # steps/00_force_align.csv: every line's confidence and whether its
    # words were kept.
    foreach: ${films}
    do:
      cmd: >-
        python ../align_srt.py "${item.original}" "${item.original}"
        out/${key}/A/fixed.srt --force-align --audio "${item.video}" --quiet
        --report out/${key}/A/fixed.report.csv --snapshots out/${key}/A/steps
        --metrics out/${key}/A/align.json --params params.yaml
        --changes out/${key}/A/changes.csv
        --audio-cache cache/${key}/confidence.sqlite
      deps:
        - ../align_srt.py
        - ${item.original}
        - ${item.video}
      params:
        - align
      outs:
        - out/${key}/A/fixed.srt
        - out/${key}/A/fixed.report.csv
        - out/${key}/A/changes.csv
      metrics:
        - out/${key}/A/align.json:
            cache: false
      plots:
        - out/${key}/A/steps:
            x: index
            y: shift_s

  diagrams_A:
    foreach: ${films}
    do:
      cmd: python flow_diagrams.py out/${key}/A
      deps:
        - flow_diagrams.py
        - out/${key}/A/steps
      outs:
        - out/${key}/A/diagrams

  evaluate_A:
    # Same check as evaluate_0, on Approach A's output: A/eval.json has the
    # same keys as 0/eval.json, so the two compare column by column.
    foreach: ${films}
    do:
      cmd: >-
        python ../evaluate_timing.py "${item.baseline}" out/${key}/A/fixed.srt
        --audio "${item.video}" --json out/${key}/A/eval.json
        --audio-cache cache/${key}/confidence.sqlite
      deps:
        - ../evaluate_timing.py
        - ../align_srt.py
        - ${item.baseline}
        - out/${key}/A/fixed.srt
      metrics:
        - out/${key}/A/eval.json:
            cache: false
